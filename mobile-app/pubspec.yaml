name: maktab
description: "TalimZ — O'zbekiston o'quvchilari uchun AI ta'lim platformasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Navigation
  go_router: ^14.2.0

  # State management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.69.0

  # Storage
  shared_preferences: ^2.3.2

  # Utils
  intl: ^0.19.0

  # AI & Chat
  google_generative_ai: ^0.4.6
  
  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  
  # HTTP
  http: ^1.2.2
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    # Ta'limZ logo fayllari
    - assets/images/logo.png
